<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student registration form</title>
    <!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> -->
</head>
<style>
    body{
        background-color:rgb(240, 176, 176);
    }
    h1{
        text-align:center;
    }
    th{
        text-align:left;
    
        
    }
    textarea{
        width: 100%;
        height: 100px;
    }
    .input[type="text"], input[type="file"], select{
        width: 100%;
        padding: 5px;
        box-sizing: border-box;
        border: white;
        border-radius: 4px;
        margin: 20px ;
    }
    table{
        border-collapse: collapse;
    
    }
    
    
</style>
<body>
    <form >
        <h1>Student Registration Form</h1>
        <table colspan="2" align="center">
            <tr>
                <th><p>Roll No :</p></th>
                <td><input style=" width: 100%;padding: 5px;box-sizing: border-box;border: white;border-radius: 4px;" border-radius: 8px  type="text" ></td>
            </tr>
            <tr>
                <th><p>Student Name : </p></th>
                <td><input style="width:25%" box-sizing: border-box;  type="text" placeholder="First Name" class="form-control"> - <input type="text" placeholder="Last Name" class="form-control"></td>
            </tr>
            <tr>
                <th><p>Father's Name :</p></th>
                <td><input style=" width: 100%;padding: 5px;box-sizing: border-box;border: white;border-radius: 4px;" border-radius: 8px  type="text"></td>
            </tr>
            <tr>
                <th><p>Date of Birth :</p></th>
                <td><input  type="text" placeholder="Day"> - <input type="text" placeholder="Month"> - <input type="text" placeholder="Year"></td>
            </tr>
            <tr>
                <th><p>Mobile No :</p></th>
                <td><input type="text" value="+91" size="1"> - <input  type="text" size="10"></td>
            </tr>
            <tr>
                <th><p>Email Id :</p></th>
                <td><input style=" width: 100%;padding: 5px;box-sizing: border-box;border: white;border-radius: 4px;" border-radius: 8px type="text" placeholder="Enter your email here!!"></td>
            </tr>
            <tr>
                <th><p>Password :</p></th>
                <td><input style=" width: 100%;padding: 5px;box-sizing: border-box;border: white;border-radius: 4px;" border-radius: 8px  type="text" placeholder="Enter your password"></td>
            </tr>
            <tr>
                <th>
                    <p>Gender :</p>
                </th>
                <td>
                    <input type="radio" name="gender" value="male">Male <input type="radio" name="gender" value="female">Female
                </td>
            </tr>
            <tr>
                <th>
                    <p>Department :</p>
                </th>
                <td>
                    <input type="checkbox" name="department" value="cse">CSE <input type="checkbox" name="department" value="it">IT <input type="checkbox" name="department" value="ece">ECE <input type="checkbox" name="department" value="civil">Civil <input type="checkbox" name="department" value="mech">Mech
                </td>
            </tr>
            <tr>
                <th>
                    <p>Course :</p>
                </th>
                <td>
                    <select>
                        <option value="course">---------------------------------------- Select Current Course ----------------------------------------</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>
                    <p>Student Photo :</p>
                </th>
                <td><input type="file"></td>
            </tr>
            <tr>
                <th>
                    <p>City :</p>
                </th>
                <td><input style=" width: 100%;padding: 5px;box-sizing: border-box;border: white;border-radius: 4px;" border-radius: 8px  type="text"></td>
            </tr>
            <tr>
                <th>
                    <p>Address :</p>
                </th>
                <td><textarea style=" width: 100%;padding: 5px;box-sizing: border-box;border: white;border-radius: 4px;" border-radius: 8px ></textarea></td>
            </tr>
           
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                </td>
            </tr>
        </table>

    </form>
    
</body>
</html>
