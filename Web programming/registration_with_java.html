
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form Validation</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
       
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, );
            z-index: -1;
        }

        /* Main form card */
        .register-card {
            width: 100%;
            max-width: 500px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.74);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);

            animation: slideIn 0.9s ease-out;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .register-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
        }

        /* Heading */
        .form-title {
            color: #172554;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
            animation: fadeIn 1.2s ease-in;
        }

        .form-title::after {
            content: "";
            display: block;
            width: 70px;
            height: 4px;
            margin: 10px auto 0;
            border-radius: 5px;
            background: #0d6efd;
        }

        /* Labels */
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 7px;
        }

        /* Input animation */
        .form-control {
            border: 1px solid #ced4da;
            border-radius: 9px;
            padding: 11px 12px;
            transition: border-color 0.3s, box-shadow 0.3s,
                        transform 0.3s;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
            transform: scale(1.02);
        }

        /* Gender radio buttons */
        .form-check-input {
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }

        .form-check-label {
            cursor: pointer;
            margin-right: 15px;
        }

        /* Validation messages */
        .err {
            display: block;
            color: #ff0202;
            font-size: 12px;
            margin-top: 4px;
            min-height: 0;
        }

        /* Buttons */
        .btn {
            border-radius: 9px;
            padding: 11px 20px;
            font-weight: bold;
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background: linear-gradient(45deg, #0d6efd, #6610f2);
            border: none;
        }

        .btn-secondary {
            border: none;
        }

        /* Entrance animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Mobile screen */
        @media (max-width: 576px) {
            body {
                padding: 20px 12px;
            }

            .register-card {
                padding: 22px 18px;
            }

            .form-title {
                font-size: 25px;
            }
        }

        /* Respect reduced-motion settings */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        } */
    </style>

    <script>
        function togglePassword(inputId, eyeId) {
        var password = document.getElementById(inputId);
        var eye = document.getElementById(eyeId);

        if (password.type === "password") {
            password.type = "text";
            eye.classList.remove("bi-eye");
            eye.classList.add("bi-eye-slash");
        } else {
            password.type = "password";
            eye.classList.remove("bi-eye-slash");
            eye.classList.add("bi-eye");
        }
}
        function validateForm() {
            var name = document.getElementById("name").value.trim();
            var email = document.getElementById("email").value.trim();
            var pwd = document.getElementById("pwd").value;
            var cpwd = document.getElementById("cpwd").value;
            var mobile = document.getElementById("mobile").value.trim();
            var age = document.getElementById("age").value;
            var gender = document.querySelector(
                'input[name="gender"]:checked'
            );

            var valid = true;

            var ids = [
                "e_name", "e_email", "e_pwd", "e_cpwd",
                "e_mobile", "e_age", "e_gender"
            ];

            for (var i = 0; i < ids.length; i++) {
                document.getElementById(ids[i]).innerHTML = "";
            }

            if (!/^[A-Za-z ]{3,}$/.test(name)) {
                document.getElementById("e_name").innerHTML =
                    "Name must contain at least 3 letters.";
                valid = false;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                document.getElementById("e_email").innerHTML =
                    "Enter a valid email address.";
                valid = false;
            }

            if (pwd.length < 6) {
                document.getElementById("e_pwd").innerHTML =
                    "Password must be at least 6 characters.";
                valid = false;
            }

            if (pwd !== cpwd) {
                document.getElementById("e_cpwd").innerHTML =
                    "Passwords do not match.";
                valid = false;
            }

            if (!/^[6-9][0-9]{9}$/.test(mobile)) {
                document.getElementById("e_mobile").innerHTML =
                    "Enter a valid 10-digit mobile number.";
                valid = false;
            }

            if (age === "" || Number(age) < 18 || Number(age) > 60) {
                document.getElementById("e_age").innerHTML =
                    "Age must be between 18 and 60.";
                valid = false;
            }

            if (!gender) {
                document.getElementById("e_gender").innerHTML =
                    "Please select a gender.";
                valid = false;
            }

            if (valid) {
                alert("Registration successful!");
            }

            return false;
        }

        function resetErrors() {
            var ids = [
                "e_name", "e_email", "e_pwd", "e_cpwd",
                "e_mobile", "e_age", "e_gender"
            ];

            for (var i = 0; i < ids.length; i++) {
                document.getElementById(ids[i]).innerHTML = "";
            }
        }
    </script>
</head>

<body>

    <div class="container d-flex justify-content-center">

        <div class="register-card">

            <h2 class="form-title">Registration Form</h2>

            <form onsubmit="return validateForm()"
                  onreset="resetErrors()">

                <!-- Name -->
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name"
                           class="form-control"
                           placeholder="Enter your full name">
                    <span class="err" id="e_name"></span>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="text" id="email"
                           class="form-control"
                           placeholder="example@gmail.com">
                    <span class="err" id="e_email"></span>
                </div>

                
<!-- Password -->
<div class="mb-3">
    <label for="pwd" class="form-label">Password</label>

    <div class="input-group">
        <input type="password" id="pwd"
               class="form-control"
               placeholder="Minimum 6 characters">

        <button class="btn btn-outline-secondary"
                type="button"
                onclick="togglePassword('pwd', 'eye1')">
            <i class="bi bi-eye" id="eye1"></i>
        </button>
    </div>

    <span class="err" id="e_pwd"></span>
</div>

<!-- Confirm Password -->
<div class="mb-3">
    <label for="cpwd" class="form-label">Confirm Password</label>

    <div class="input-group">
        <input type="password" id="cpwd"
               class="form-control"
               placeholder="Re-enter your password">

        <button class="btn btn-outline-secondary"
                type="button"
                onclick="togglePassword('cpwd', 'eye2')">
            <i class="bi bi-eye" id="eye2"></i>
        </button>
    </div>

    <span class="err" id="e_cpwd"></span>
</div>


                <!-- Mobile -->
                <div class="mb-3">
                    <label for="mobile" class="form-label">Mobile</label>
                    <input type="text" id="mobile"
                           class="form-control"
                           placeholder="10-digit mobile number"
                           maxlength="10">
                    <span class="err" id="e_mobile"></span>
                </div>

                <!-- Age -->
                <div class="mb-3">
                    <label for="age" class="form-label">Age</label>
                    <input type="number" id="age"
                           class="form-control"
                           placeholder="Enter your age"
                           min="18" max="60">
                    <span class="err" id="e_age"></span>
                </div>

                <!-- Gender -->
                <div class="mb-4">
                    <label class="form-label d-block">Gender</label>

                    <div class="form-check form-check-inline">
                        <input type="radio" name="gender"
                               id="male" value="Male"
                               class="form-check-input">
                        <label for="male" class="form-check-label">
                            Male
                        </label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input type="radio" name="gender"
                               id="female" value="Female"
                               class="form-check-input">
                        <label for="female" class="form-check-label">
                            Female
                        </label>
                    </div>

                    <span class="err" id="e_gender"></span>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-center gap-3">
                    <button type="submit"
                            class="btn btn-primary flex-fill">
                        Register
                    </button>

                    <button type="reset"
                            class="btn btn-secondary flex-fill">
                        Reset
                    </button>
                </div>

            </form>

        </div>
    </div>

</body>
</html>
