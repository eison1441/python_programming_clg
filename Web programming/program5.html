<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Target Frames</title>

    <style>
        /* Remove default browser spacing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Main container */
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* Left navigation sidebar */
        .sidebar {
            width: 250px;
            min-width: 250px;
            height: 100vh;

            background-color: #5b8e5c;

            padding: 30px 20px;

            overflow-y: auto;
        }

        /* Sidebar heading */
        .sidebar h2 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 22px;
        }

        /* Sidebar links */
        .sidebar a {
            display: block;

            padding: 14px 15px;
            margin-bottom: 15px;

            color: rgb(4, 4, 128);
            background-color: white;

            text-decoration: underline;

            font-family: "Times New Roman", Times, serif;
            font-size: 17px;
            font-weight: bold;

            border-radius: 6px;

            transition: 0.3s;
        }

        /* Hover effect */
        .sidebar a:hover {
            background-color: #e8f5e9;
            color: darkblue;
            transform: translateX(4px);
        }

        /* Right content area */
        .content {
            flex: 1;
            height: 100vh;
            min-width: 0;
        }

        /* Website iframe */
        .main-frame {
            display: block;

            width: 100%;
            height: 100%;

            border: none;
        }

        /* Responsive design for smaller screens */
        @media (max-width: 768px) {

            .sidebar {
                width: 190px;
                min-width: 190px;
                padding: 20px 12px;
            }

            .sidebar h2 {
                font-size: 18px;
            }

            .sidebar a {
                font-size: 14px;
                padding: 12px 10px;
            }
        }
        header{
                padding: 20px;
                color: aliceblue;
                margin-bottom: 25px;
                background-color: black;
            }

        /* Very small screens */
        @media (max-width: 500px) {

            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                min-width: 100%;
                height: auto;

                display: flex;
                gap: 8px;

                padding: 10px;
            }

            .sidebar h2 {
                display: none;
            }

            .sidebar a {
                flex: 1;
                margin-bottom: 0;
                text-align: center;
                font-size: 12px;
                padding: 10px 5px;
            }

            .content {
                height: calc(100vh - 65px);
            }
            
        }
        .navbar {
            background-color: #0a196d;
            min-height: 100px;
            padding-left: 7%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 18px;
            font-size: 14px;
        }

        .navbar a:hover {
            background-color: #ffff;
            border-radius: 15px;
            color: #0a196d;
        }
        .courosal {
         position: relative;
        }

        .courosal img {
            width: 100%;
        }   

        .courosal h1 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 50px;
            font-weight: bold;
        }
        .courosal p {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 25px;
            font-weight: bold;
        }
        
    </style>
</head>

<body>

    <div class="container">

</body>
